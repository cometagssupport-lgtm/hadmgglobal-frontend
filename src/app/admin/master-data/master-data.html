<div class="master-container">

  <h2 class="title">Master Data</h2>

  <!-- Maintenance Toggle -->
  <div class="section">
    <label class="label">Application Under Maintenance?</label>

    <label class="toggle-switch">
      <input type="checkbox" [(ngModel)]="formData.isMaintenance" (change)="checkIfChanged()" />
      <span class="slider"></span>
    </label>
  </div>

  <div class="section" *ngIf="false">
    <label class="label">Enable new game card</label>

    <label class="toggle-switch">
      <input type="checkbox" [(ngModel)]="formData.isGameEnabled" (change)="checkIfChanged()" />
      <span class="slider"></span>
    </label>
  </div>

  <!-- Telegram URL -->
  <div class="section">
    <label class="label">Home Group Link</label>
    <input type="text" [(ngModel)]="formData.telegramUrl" class="input-box" (input)="checkIfChanged()" />
  </div>

  <!-- Secondary Telegram URL -->
  <div class="section">
    <label class="label">Customer Support Link</label>
    <input type="text" [(ngModel)]="formData.telegramUrlOne" class="input-box" (input)="checkIfChanged()" />
  </div>

  <!-- Secondary Telegram URL -->
  <div class="section">
    <label class="label">Profile Telegram URL</label>
    <input type="text" [(ngModel)]="formData.telegramUrlTwo" class="input-box" (input)="checkIfChanged()" />
  </div>

  <!-- Hoem Text 1 -->
  <div class="section">
    <label class="label">Home Text 1</label>
    <input type="text" [(ngModel)]="formData.homeText1" class="input-box" (input)="checkIfChanged()" />
  </div>

  <!-- Home Text 2 -->
  <div class="section">
    <label class="label">Home Text 2</label>
    <input type="text" [(ngModel)]="formData.homeText2" class="input-box" (input)="checkIfChanged()" />
  </div>

  <!-- UPDATE BUTTON -->
  <button class="update-btn" [disabled]="!isChanged" (click)="updateMasterData()">
    Update
  </button>

</div>



<!-- Retrieve / Reset Password Section -->
<div class="section" style="margin-top: 30px; border-top: 1px solid #ddd; padding-top: 20px;max-width: 500px;">

  <label class="label">Retrieve / Reset Password</label>

  <!-- Email Input -->
  <input type="email" [(ngModel)]="resetEmail" placeholder="Enter email" class="input-box" />

  <!-- Password Input -->
  <input type="text" [(ngModel)]="generatedPassword" placeholder="Enter password" class="input-box" style="margin-top: 10px;" />

  <!-- Update Password Button -->
  <button class="update-btn" style="margin-top: 10px;" [disabled]="!resetEmail || !generatedPassword" (click)="updatePassword()">
    Update Password
  </button>

</div>
