<div class="admin-layout">

  <!-- 🔹 Top Navigation -->
  <header class="admin-topnav">
    <div class="menu-icon" (click)="toggleSidebar()">
      <h5>ADMIN</h5>
    </div>
    <!-- <div class="topnav-title">COMET AGS ADMIN</div> -->
    <div class="admin-profile"></div>
  </header>

  <!-- 🔹 Sidebar -->
  <aside class="sidebar" [class.closed]="!isSidebarOpen" [class.open]="isSidebarOpen">
    <div class="sidebar-logo">COMET ADMIN</div>

    <ul class="sidebar-menu">

      <!-- Dashboard -->
      <li (click)="navigateTo('dashboard')" [class.active]="currentActive === 'dashboard'">
        <img src="/loadercoms.svg" alt="dashboard">
        <span>Dashboard</span>
      </li>

      <!-- Users -->
      <li (click)="navigateTo('users')" [class.active]="currentActive === 'users'">
        <img src="/team.svg" alt="users">
        <span>Users</span>
      </li>

      <!-- Deposits -->
      <li (click)="navigateTo('deposits')" [class.active]="currentActive === 'deposits'">
        <img src="/deposit.svg" alt="deposits">
        <span>Deposits</span>
      </li>

      <!-- Withdrawls Parent -->
      <li class="has-submenu" [class.active]="activeSection === 'withdrawls'" (click)="toggleWithdrawMenu()">
        <img src="/withdrawal.svg" alt="withdrawls">
        <span>Withdrawls</span>
        <img [src]="withdrawMenuOpen ? '/arrow-up.svg' : '/arrow-down.svg'" alt="chevron"
          style="margin-left:auto; width:12px; height:12px;">
      </li>

      <!-- Withdrawls Submenu -->
      <ul class="submenu" *ngIf="withdrawMenuOpen">

        <li (click)="navigateTo('withdrawl-requests', $event)" [class.active]="currentActive === 'withdrawl-requests'">
          <img src="/history.svg" alt="requests">
          <span>Withdrawl Requests</span>
        </li>

        <li (click)="navigateTo('withdrawl-accepts', $event)" [class.active]="currentActive === 'withdrawl-accepts'">
          <img src="/all-trans.svg" alt="accepts">
          <span>Withdrawl Accepts</span>
        </li>

        <li (click)="navigateTo('withdrawl-rejects', $event)" [class.active]="currentActive === 'withdrawl-rejects'">
          <img src="/close_round.svg" alt="rejects">
          <span>Withdrawl Rejects</span>
        </li>

      </ul>

      <!-- Master Data -->
      <li (click)="navigateTo('master-data')" [class.active]="currentActive === 'master-data'">
        <img src="/profile.svg" alt="master-data">
        <span>Master Data</span>
      </li>

    </ul>
  </aside>

  <!-- 🔹 Main Content -->
  <main class="main-content" [class.expanded]="!isSidebarOpen">
    <router-outlet></router-outlet>
  </main>

</div>
